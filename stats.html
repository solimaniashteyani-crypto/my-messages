<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه ۱۱ — آمار</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --bg-1:#e0f2fe; --bg-2:#f0f9ff; --bg-3:#fff;
    --card:#fff; --card-soft:#f8fbff;
    --text:#0c1e3e; --muted:#5b7ba6;
    --accent:#0ea5e9; --accent-2:#6366f1; --accent-deep:#0369a1;
    --border:#dbeafe; --border-strong:#bfdbfe;
    --ok:#16a34a; --err:#dc2626; --warn:#d97706;
  }
  *{box-sizing:border-box}
  body{
    font-family:Vazirmatn,system-ui,sans-serif;
    margin:0; padding:24px 20px 60px;
    color:var(--text);
    background:
      radial-gradient(1000px 500px at 100% 0%, #bae6fd 0%, transparent 55%),
      radial-gradient(800px 500px at 0% 100%, #c7d2fe 0%, transparent 55%),
      linear-gradient(160deg,#e0f2fe 0%, #f0f9ff 45%, #fff 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto}
  h1{
    font-size:26px; margin:0 0 6px; font-weight:800;
    background:linear-gradient(135deg,#0369a1,#6366f1);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color:var(--muted); font-size:14px; margin-bottom:20px}

  /* نوار دکمه‌ها */
  .nav{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-bottom:20px;
  }
  .nav a, .nav button{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 18px; border-radius:12px;
    font-family:inherit; font-size:14px; font-weight:600;
    text-decoration:none; cursor:pointer; border:none;
    transition:all .2s;
  }
  .nav .primary{
    background:linear-gradient(135deg,#0ea5e9,#6366f1);
    color:#fff; box-shadow:0 4px 14px rgba(14,165,233,.35);
  }
  .nav .primary:hover{transform:translateY(-1px)}
  .nav .ghost{
    background:transparent; color:var(--muted);
    border:1.5px solid var(--border-strong);
  }
  .nav .ghost:hover{background:var(--card-soft); color:var(--text)}

  /* خلاصه */
  .summary{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px; margin-bottom:24px;
  }
  .stat-box{
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:14px 18px; text-align:center;
    box-shadow:0 4px 12px rgba(12,30,62,.06);
  }
  .stat-box .num{
    font-size:28px; font-weight:800;
    background:linear-gradient(135deg,#0369a1,#6366f1);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stat-box .lbl{font-size:12px; color:var(--muted); margin-top:4px}

  /* کارت پیام */
  .msg-card{
    background:#fff; border:1px solid var(--border); border-radius:18px;
    padding:20px 22px; margin-bottom:16px;
    box-shadow:0 4px 14px rgba(12,30,62,.06), 0 12px 28px rgba(14,165,233,.08);
    animation:in .3s ease;
  }
  @keyframes in{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .msg-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; flex-wrap:wrap; margin-bottom:12px;
    padding-bottom:12px; border-bottom:1px dashed var(--border);
  }
  .msg-header .group{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(14,165,233,.1); color:var(--accent-deep);
    padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600;
  }
  .msg-header .time{color:var(--muted); font-size:12px}
  .msg-body{
    font-size:15px; line-height:1.75; white-space:pre-wrap;
    word-break:break-word; margin-bottom:12px;
  }
  .msg-body img{max-width:100%; border-radius:10px; margin-top:8px; display:block}

  /* گرید آمار */
  .msg-stats{
    display:grid; grid-template-columns:1fr; gap:14px;
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);
  }
  @media (min-width:640px){
    .msg-stats{grid-template-columns:1fr 1fr}
    .msg-stats .full{grid-column:1/-1}
  }

  .stat-col h4{
    font-size:13px; margin:0 0 8px; font-weight:700;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .stat-col h4.blue{color:#0369a1}
  .stat-col h4.red{color:#dc2626}
  .stat-col h4.green{color:#16a34a}
  .stat-col h4.purple{color:#7c3aed}
  .stat-col h4.gray{color:#5b7ba6}

  .pill-list{display:flex; flex-direction:column; gap:6px}
  .member-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:10px;
    font-size:13px; border:1px solid;
    transition:all .2s;
  }
  .member-row.seen{
    background:#ecfdf5; border-color:#a7f3d0; color:#047857;
  }
  .member-row.unseen{
    background:#fef2f2; border-color:#fecaca; color:#b91c1c;
  }
  .member-row .status{font-size:16px; width:20px; text-align:center}
  .member-row .name{font-weight:600}
  .member-row .role{
    font-size:11px; opacity:.75;
    background:rgba(0,0,0,.05); padding:2px 8px; border-radius:999px;
  }
  .member-row .phone{
    font-size:11px; margin-right:auto;
    color:#0369a1; text-decoration:none;
  }
  .member-row .phone:hover{text-decoration:underline}
  .member-row time{
    font-size:10px; opacity:.7; margin-right:auto;
  }

  .pill{
    background:var(--card-soft); border:1px solid var(--border);
    padding:4px 10px; border-radius:999px;
    font-size:12px; color:var(--text);
    display:inline-flex; align-items:center; gap:5px;
    margin:2px;
  }
  .pill.react{background:#eff6ff; border-color:#bfdbfe; color:#1e40af}
  .pill.reply{background:#f5f3ff; border-color:#ddd6fe; color:#6d28d9}

  .reply-item{
    background:var(--card-soft); border-right:3px solid var(--accent-2);
    border-radius:10px; padding:8px 12px; margin:6px 0; font-size:13px;
  }
  .reply-item b{color:#6d28d9}
  .reply-item time{color:var(--muted); font-size:11px; margin-right:8px}

  .empty{text-align:center; color:var(--muted); padding:60px 20px}
  .empty::before{content:'📊'; display:block; font-size:60px; margin-bottom:12px; opacity:.4}
  .loading{text-align:center; color:var(--muted); padding:40px; font-size:15px}
  .loading::before{content:'⏳'; display:block; font-size:40px; margin-bottom:10px; animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  .error{
    background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
    padding:16px 20px; border-radius:12px; text-align:center; font-size:14px;
  }
  .progress-bar{
    height:6px; background:#e0f2fe; border-radius:4px; overflow:hidden;
    margin:6px 0;
  }
  .progress-bar > div{
    height:100%; background:linear-gradient(90deg,#0ea5e9,#6366f1);
    transition:width .3s ease;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 سامانه ۱۱ — آمار</h1>
  <div class="subtitle">نمایش کامل بینندگان، ری‌اکشن‌ها و پاسخ‌ها</div>

  <div class="nav">
    <a href="./send.html" class="primary">⚙️ پنل ادمین</a>
    <a href="./index.html" class="ghost">🌐 نمایش پیام‌ها</a>
    <button onclick="loadStats()" class="ghost">🔄 به‌روزرسانی</button>
    <span id="lastUpdate" style="font-size:12px;color:var(--muted); margin-right:auto; align-self:center;"></span>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;">
    <label style="font-size:13px; color:#5b7ba6; font-weight:600;">فیلتر گروه:</label>
    <select id="groupFilter" style="padding:8px 14px; border-radius:10px; font-family:inherit; font-size:14px; border:1.5px solid #dbeafe; background:#f8fbff; color:#0c1e3e; cursor:pointer;">
      <option value="all">🌐 همه گروه‌ها</option>
    </select>
  </div>

  <div class="summary" id="summary"></div>
  <div id="content"></div>
</div>

<script src="config.js"></script>
<script>
const C = window.CONFIG;
const API = `https://api.github.com/repos/${C.owner}/${C.repo}/contents/messages.json`;

const b64decode = b64 => {
  const bin = atob(b64.replace(/\n/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
};

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtTime = iso => new Date(iso).toLocaleString('fa-IR', {
  year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit'
});

const fmtTimeShort = iso => {
  const d = new Date(iso);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60)    return 'الان';
  if (diff < 3600)  return `${Math.floor(diff/60)} دقیقه پیش`;
  if (diff < 86400) return `${Math.floor(diff/3600)} ساعت پیش`;
  return d.toLocaleDateString('fa-IR');
};

let db = null;

async function loadStats() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">در حال بارگذاری آمار...</div>';

  try {
    const r = await fetch(API + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    db = JSON.parse(b64decode(j.content));

    document.getElementById('lastUpdate').textContent =
      'آخرین به‌روزرسانی: ' + new Date().toLocaleTimeString('fa-IR');

    renderSummary();
    renderMessages();
  } catch (e) {
    content.innerHTML = `<div class="error">❌ خطا در دریافت اطلاعات: ${esc(e.message)}</div>`;
  }
}

function renderSummary() {
  const msgs = db.messages || [];
  const rx = db.reactions || [];
  const rp = db.replies || [];
  const sn = db.seen || [];

  document.getElementById('summary').innerHTML = `
    <div class="stat-box"><div class="num">${msgs.length}</div><div class="lbl">📨 پیام‌ها</div></div>
    <div class="stat-box"><div class="num">${sn.length}</div><div class="lbl">👁 بازدیدها</div></div>
    <div class="stat-box"><div class="num">${rx.length}</div><div class="lbl">❤️ ری‌اکشن‌ها</div></div>
    <div class="stat-box"><div class="num">${rp.length}</div><div class="lbl">💬 پاسخ‌ها</div></div>
  `;

  const sel = document.getElementById('groupFilter');
  sel.innerHTML = '<option value="all">🌐 همه گروه‌ها</option>' +
    Object.entries(C.groups).map(([k,g]) =>
      `<option value="${k}">${g.emoji} ${g.name}</option>`).join('');
  sel.onchange = renderMessages;
}

function renderMessages() {
  const content = document.getElementById('content');
  const filter = document.getElementById('groupFilter').value;

  const messages = (db.messages || [])
    .filter(m => filter === 'all' || m.group === filter)
    .sort((a,b) => new Date(b.time) - new Date(a.time));

  if (!messages.length) {
    content.innerHTML = '<div class="empty">هنوز پیامی نیست</div>';
    return;
  }

  content.innerHTML = messages.map(m => renderMessageCard(m)).join('');
}

function renderMessageCard(m) {
  const group = C.groups[m.group];
  const groupName = group ? group.emoji + ' ' + group.name : '—';

  // بینندگان این پیام
  const seen = (db.seen || []).filter(s => s.messageId === m.id);
  const seenNames = seen.map(s => s.from);

  // لیست اعضای گروه
  const members = group?.members || [];
  const totalMembers = members.length;
  const seenCount = members.length
    ? members.filter(mb => seenNames.includes(mb.name)).length
    : seen.length;

  // ری‌اکشن‌ها
  const reactions = (db.reactions || []).filter(r => r.messageId === m.id);

  // پاسخ‌ها
  const replies = (db.replies || []).filter(r => r.messageId === m.id)
    .sort((a,b) => new Date(a.time) - new Date(b.time));

  // ساخت لیست اعضا
  let membersListHtml = '';
  if (members.length) {
    membersListHtml = members.map(mb => {
      const seenItem = seen.find(s => s.from === mb.name);
      const isSeen = !!seenItem;
      const phoneLink = mb.phone
        ? `<a class="phone" href="tel:${esc(mb.phone)}" title="تماس">📞 ${esc(mb.phone)}</a>`
        : '';
      const roleTag = mb.role
        ? `<span class="role">${esc(mb.role)}</span>`
        : '';
      return `
        <div class="member-row ${isSeen ? 'seen' : 'unseen'}">
          <span class="status">${isSeen ? '✅' : '❌'}</span>
          <span class="name">${esc(mb.name)}</span>
          ${roleTag}
          ${phoneLink}
          ${isSeen
            ? `<time>${fmtTimeShort(seenItem.time)}</time>`
            : '<span class="phone" style="color:#b91c1c">ندیده</span>'}
        </div>
      `;
    }).join('');
  } else {
    // اگه لیست اعضا خالی باشه، فقط کسایی که دیدن رو نشون بده
    membersListHtml = seen.map(s => `
      <div class="member-row seen">
        <span class="status">✅</span>
        <span class="name">${esc(s.from)}</span>
        <time>${fmtTimeShort(s.time)}</time>
      </div>
    `).join('') || '<div style="font-size:12px;color:var(--muted);padding:8px 0">هنوز کسی ندیده</div>';
  }

  const pct = totalMembers ? Math.round(seenCount / totalMembers * 100) : 0;
  const seenTitle = totalMembers
    ? `👁 بینندگان <span class="pill" style="background:#ecfdf5;color:#047857;border-color:#a7f3d0">${seenCount} از ${totalMembers} (${pct}%)</span>`
    : `👁 بینندگان <span class="pill" style="background:#ecfdf5;color:#047857;border-color:#a7f3d0">${seenCount}</span>`;

  const rxSection = reactions.length ? `
    <div class="stat-col">
      <h4 class="blue">❤️ ری‌اکشن‌ها (${reactions.length})</h4>
      <div class="pill-list" style="flex-direction:row;flex-wrap:wrap">
        ${reactions.map(r => `
          <span class="pill react">${r.emoji} ${esc(r.from)}</span>
        `).join('')}
      </div>
    </div>
  ` : `
    <div class="stat-col">
      <h4 class="gray">❤️ ری‌اکشن‌ها (0)</h4>
      <div style="font-size:12px;color:var(--muted);padding:4px 0">هنوز کسی ری‌اکشن نداده</div>
    </div>
  `;

  const replySection = replies.length ? `
    <div class="stat-col full">
      <h4 class="purple">💬 پاسخ‌ها (${replies.length})</h4>
      ${replies.map(r => `
        <div class="reply-item">
          <b>${esc(r.from)}</b>
          <time>${fmtTimeShort(r.time)}</time>
          <div>${esc(r.text)}</div>
        </div>
      `).join('')}
    </div>
  ` : `
    <div class="stat-col full">
      <h4 class="gray">💬 پاسخ‌ها (0)</h4>
      <div style="font-size:12px;color:var(--muted);padding:4px 0">هنوز کسی پاسخ نداده</div>
    </div>
  `;

  return `
    <div class="msg-card">
      <div class="msg-header">
        <span class="group">${groupName}</span>
        <span class="time">${fmtTime(m.time)}</span>
      </div>
      ${m.text ? `<div class="msg-body">${esc(m.text)}</div>` : ''}
      ${m.image ? `<div class="msg-body"><img src="${esc(m.image)}" loading="lazy"></div>` : ''}
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="msg-stats">
        <div class="stat-col">
          <h4 class="green">${seenTitle}</h4>
          <div class="pill-list">${membersListHtml}</div>
        </div>
        ${rxSection}
        ${replySection}
      </div>
    </div>
  `;
}

// بوت
loadStats();
setInterval(loadStats, 2 * 60 * 1000);
</script>
</body>
</html>
