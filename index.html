<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="description" content="سامانه پیام‌رسان سما — نسخه ۵/۱۱">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سما">
  <title>سما — سامانه پیام‌رسان شخصی</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    .admin-entry {
      padding: 16px 22px 8px;
      max-width: 780px;
      margin: 0 auto;
    }
    .admin-entry[hidden] { display: none; }
    .admin-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 640px) {
      .admin-buttons { grid-template-columns: 1fr 1fr; }
    }
    .admin-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 12px;
      background: #f0f7ff;
      color: #1e3a8a;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: all .2s;
      text-align: center;
    }
    .admin-btn:hover {
      background: #fff;
      border-color: #1e40af;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30,64,175,.15);
    }
    .admin-btn.primary {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(30,64,175,.35);
    }
    .admin-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(30,64,175,.45);
    }
  </style>
</head>
<body>

  <script>
    (function() {
      try {
        var isAdmin = localStorage.getItem('isAdmin') === 'true';
        if (isAdmin) return;
        if (localStorage.getItem('registered') !== 'true' ||
            !localStorage.getItem('myName') ||
            !localStorage.getItem('myPhone')) {
          localStorage.removeItem('registered');
          localStorage.removeItem('myName');
          localStorage.removeItem('myGroups');
          localStorage.removeItem('myGroup');
          localStorage.removeItem('myPhone');
          localStorage.removeItem('myPersonalTopic');
          localStorage.removeItem('myProvince');
          window.location.replace('./register.html');
        }
      } catch(e) {
        window.location.replace('./register.html');
      }
    })();
  </script>

  <header>
    <h1>📬 سما</h1>
      <div class="header-actions">
      <button id="logoutAdminBtn" title="خروج از ادمین" hidden style="background:rgba(220,38,38,.1); color:#dc2626;">🚪</button>
      <button id="refreshBtn" title="به‌روزرسانی">🔄</button>
    </div>
  </div>
  </header>

  <div class="admin-entry" id="adminEntry" hidden>
    <div class="admin-buttons">
      <a href="./index.html" class="admin-btn primary">
        🌐 نمایش پیام‌ها
      </a>
      <a href="./send.html" class="admin-btn">
        ⚙️ پنل ادمین
      </a>
      <a href="./stats.html" class="admin-btn">
        📊 صفحه آمار
      </a>
      <a href="./members.html" class="admin-btn">
        👥 مدیریت اعضا
      </a>
    </div>
  </div>

  <div id="offline" class="offline-bar" hidden>📴 حالت آفلاین — آخرین نسخه ذخیره‌شده</div>

  <nav id="tabs"></nav>
  <div id="status" class="status"></div>
  <main id="feed"></main>

  <dialog id="settingsDlg">
    <form method="dialog">
      <h3>تنظیمات</h3>
      <label>نام من
        <input id="myName" placeholder="مثلاً علی" autocomplete="off">
      </label>
      <label>گروه من
        <select id="myGroup"></select>
      </label>
      <menu>
        <button value="save">ذخیره</button>
      </menu>
    </form>
  </dialog>

  <dialog id="replyDlg">
    <form method="dialog">
      <h3>پاسخ به پیام</h3>
      <div id="replyQuote" class="quote"></div>
      <textarea id="replyText" placeholder="پاسخ خود را بنویسید..." rows="3"></textarea>
      <menu>
        <button value="cancel" class="ghost">لغو</button>
        <button id="replySendBtn" type="button">ارسال</button>
      </menu>
    </form>
  </dialog>

  <script src="db.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
