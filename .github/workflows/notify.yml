name: Notify on new message

on:
  push:
    paths: ['messages.json']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Detect new messages & push to ntfy
        env:
          NTFY: https://ntfy.sh
          PWA_URL: https://solimaniashteyani-crypto.github.io/my-messages/
        run: |
          set -e
          git show HEAD~1:messages.json > /tmp/old.json 2>/dev/null || echo '{"messages":[]}' > /tmp/old.json

          jq -c --slurpfile old /tmp/old.json '
            .messages[]
            | select(.id as $i | ($old[0].messages | map(.id) | index($i) | not))
          ' messages.json > /tmp/new.ndjson || true

          cat > /tmp/topics.mjs <<'EOF'
          import fs from 'fs';
          const src = fs.readFileSync('config.js','utf8');
          const s = {}; new Function('window', src)(s);
          console.log(JSON.stringify(s.CONFIG.groups));
          EOF
          TOPICS=$(node /tmp/topics.mjs)

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ID=$(echo "$line"  | jq -r .id)
            TXT=$(echo "$line" | jq -r '.text // ""')
            IMG=$(echo "$line" | jq -r '.image // empty')

            # گروه‌ها
            echo "$line" | jq -r '(.groups // []) | .[]' | while IFS= read -r grp; do
              [ -z "$grp" ] && continue
              TOPIC=$(echo "$TOPICS" | jq -r --arg g "$grp" '.[$g].topic // empty')
              NAME=$(echo "$TOPICS"  | jq -r --arg g "$grp" '.[$g].name  // empty')
              [ -z "$TOPIC" ] && continue
              if [ -n "$IMG" ]; then
                curl -s -H "Title: 🔔 پیام جدید برای $NAME" -H "Priority: max" \
                  -H "Tags: rotating_light,framed_picture" -H "Click: ${PWA_URL}" \
                  -H "Attach: $IMG" -H "X-Message-Id: $ID" -d "$TXT" "$NTFY/$TOPIC" > /dev/null
              else
                curl -s -H "Title: 🔔 پیام جدید برای $NAME" -H "Priority: max" \
                  -H "Tags: rotating_light,speech_balloon" -H "Click: ${PWA_URL}" \
                  -H "X-Message-Id: $ID" -d "$TXT" "$NTFY/$TOPIC" > /dev/null
              fi
            done

            # افراد اختصاصی
            echo "$line" | jq -c '(.personalRecipients // []) | .[]' | while IFS= read -r p; do
              [ -z "$p" ] && continue
              P_TOPIC=$(echo "$p" | jq -r .topic)
              P_NAME=$(echo "$p" | jq -r .name)
              [ -z "$P_TOPIC" ] && continue
              if [ -n "$IMG" ]; then
                curl -s -H "Title: 🔔 پیام خصوصی برای $P_NAME" -H "Priority: max" \
                  -H "Tags: lock,framed_picture" -H "Click: ${PWA_URL}" \
                  -H "Attach: $IMG" -H "X-Message-Id: $ID" -d "$TXT" "$NTFY/$P_TOPIC" > /dev/null
              else
                curl -s -H "Title: 🔔 پیام خصوصی برای $P_NAME" -H "Priority: max" \
                  -H "Tags: lock,speech_balloon" -H "Click: ${PWA_URL}" \
                  -H "X-Message-Id: $ID" -d "$TXT" "$NTFY/$P_TOPIC" > /dev/null
              fi
            done
          done < /tmp/new.ndjson
