<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامانه پیام‌رسان سما — پنل ادمین</title>
<meta name="description" content="پنل ارسال پیام سامانه پیام‌رسان سما — نسخه 5/11">
<link rel="manifest" href="admin-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پنل ادمین سما">
<meta name="theme-color" content="#1e40af">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --primary:#1e40af;
    --primary-2:#3b82f6;
    --primary-deep:#1e3a8a;
    --accent:#2563eb;
    --text:#0c1e3e;
    --muted:#64748b;
    --border:#bfdbfe;
    --border-strong:#93c5fd;
    --ok:#16a34a;
    --err:#dc2626;
    --card:#ffffff;
    --card-soft:#f0f7ff;
    --shadow-card:0 12px 40px rgba(30,64,175,.15), 0 4px 14px rgba(12,30,62,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Vazirmatn,system-ui,sans-serif;
    font-size:18px;
    background:
      radial-gradient(1200px 600px at 100% -10%, #93c5fd 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #bfdbfe 0%, transparent 55%),
      linear-gradient(160deg,#dbeafe 0%, #eff6ff 45%, #fff 100%);
    background-attachment:fixed;
    color:var(--text);
    padding:32px 20px 60px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{
    max-width:600px;
    margin:0 auto;
  }

  /* ═══════════ هدر ═══════════ */
  .header{
    text-align:center;
    margin-bottom:28px;
  }
  .header .icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:80px; height:80px;
    border-radius:24px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff;
    font-size:40px;
    box-shadow:0 16px 40px rgba(30,64,175,.35);
    margin-bottom:14px;
  }
  .header h1{
    font-size:30px;
    margin:0 0 6px;
    font-weight:900;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-.5px;
  }
  .header .subtitle{
    color:var(--muted);
    font-size:16px;
    font-weight:600;
  }

  /* ═══════════ کارت اصلی ═══════════ */
  .main-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;
    padding:32px 28px;
    box-shadow:var(--shadow-card);
    position:relative;
    overflow:hidden;
  }
  .main-card::before{
    content:'';
    position:absolute;
    top:0; right:0; left:0;
    height:5px;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#60a5fa);
  }

  /* ═══════════ دکمه‌های ناوبری ═══════════ */
  .nav-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:26px;
    padding-bottom:26px;
    border-bottom:2px dashed var(--border);
  }
  .nav-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:18px 20px;
    border-radius:16px;
    font-family:inherit;
    font-size:18px;
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
    border:none;
    transition:all .25s ease;
    text-align:center;
  }
  .nav-btn.primary{
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff;
    box-shadow:0 8px 22px rgba(30,64,175,.35);
  }
  .nav-btn.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(30,64,175,.5);
  }
  .nav-btn.ghost{
    background:var(--card-soft);
    color:var(--primary-deep);
    border:2px solid var(--border);
  }
  .nav-btn.ghost:hover{
    background:#fff;
    border-color:var(--primary);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(30,64,175,.15);
  }

  /* ═══════════ کارت توکن ═══════════ */
  .token-card{
    background:linear-gradient(135deg,#ecfdf5,#d1fae5);
    border:2px solid #6ee7b7;
    border-radius:16px;
    padding:18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:24px;
    box-shadow:0 6px 18px rgba(16,185,129,.15);
  }
  .token-card[hidden]{display:none}
  .token-card .info{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    color:#047857;
    font-size:17px;
  }
  .token-card .info .icon{font-size:26px}
  .token-card .logout-btn{
    background:transparent;
    color:#047857;
    border:2px solid #047857;
    padding:10px 20px;
    font-size:15px;
    font-weight:800;
    border-radius:12px;
    font-family:inherit;
    cursor:pointer;
    transition:all .2s ease;
  }
  .token-card .logout-btn:hover{
    background:#047857;
    color:#fff;
  }

  /* ═══════════ فرم توکن ═══════════ */
  .token-form[hidden]{display:none}
  .field-label{
    display:block;
    margin:0 0 12px;
    font-size:18px;
    font-weight:800;
    color:var(--text);
  }
  .field-label .req{
    color:var(--err);
    margin-right:6px;
  }
  .token-input{
    width:100%;
    padding:18px 22px;
    background:var(--card-soft);
    border:2.5px solid var(--border);
    color:var(--text);
    border-radius:16px;
    font-family:inherit;
    font-size:18px;
    font-weight:500;
    transition:all .25s ease;
  }
  .token-input:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 6px rgba(30,64,175,.15);
  }
  .save-token-row{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .token-msg{
    margin-top:14px;
    font-size:16px;
    font-weight:700;
  }

  /* ═══════════ گروه‌ها ═══════════ */
  .group-chips{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:24px;
  }
  .group-chips input[type="radio"]{display:none}
  .group-chips label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 22px;
    background:var(--card-soft);
    border:2.5px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
    font-weight:800;
    color:var(--muted);
    margin:0;
    transition:all .25s ease;
  }
  .group-chips label:hover{
    border-color:var(--primary);
    color:var(--primary-deep);
    transform:translateY(-2px);
  }
  .group-chips input[type="radio"]:checked + label{
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    border-color:transparent;
    color:#fff;
    box-shadow:0 8px 22px rgba(30,64,175,.4);
    transform:translateY(-2px);
  }

  /* ═══════════ فیلدها ═══════════ */
  .field{margin-bottom:24px}
  .field textarea,
  .field input[type="file"]{
    width:100%;
    padding:18px 22px;
    background:var(--card-soft);
    border:2.5px solid var(--border);
    color:var(--text);
    border-radius:16px;
    font-family:inherit;
    font-size:18px;
    font-weight:500;
    resize:vertical;
    transition:all .25s ease;
  }
  .field textarea{min-height:150px; line-height:1.8}
  .field textarea:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 6px rgba(30,64,175,.15);
  }
  .field input[type="file"]{padding:14px 18px; cursor:pointer}

  .preview{
    max-width:240px;
    border-radius:16px;
    margin-top:16px;
    display:none;
    box-shadow:0 8px 24px rgba(30,64,175,.2);
  }

  /* ═══════════ دکمه‌های اکشن ═══════════ */
  .actions{
    display:flex;
    gap:14px;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .btn-main{
    flex:1;
    min-width:180px;
    padding:20px 28px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff;
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-family:inherit;
    font-size:20px;
    font-weight:900;
    box-shadow:0 10px 26px rgba(30,64,175,.4);
    transition:all .25s ease;
  }
  .btn-main:hover:not(:disabled){
    transform:translateY(-3px);
    box-shadow:0 14px 34px rgba(30,64,175,.55);
  }
  .btn-main:active:not(:disabled){transform:translateY(0) scale(.98)}
  .btn-main:disabled{opacity:.5; cursor:not-allowed; box-shadow:none}

  .btn-ghost{
    padding:18px 26px;
    background:transparent;
    color:var(--muted);
    border:2.5px solid var(--border-strong);
    border-radius:16px;
    cursor:pointer;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    transition:all .25s ease;
  }
  .btn-ghost:hover{
    background:var(--card-soft);
    color:var(--text);
    border-color:var(--primary);
    transform:translateY(-2px);
  }

  /* ═══════════ نوار پیشرفت ═══════════ */
  .progress{
    height:8px;
    background:#dbeafe;
    border-radius:6px;
    overflow:hidden;
    margin-top:20px;
    display:none;
  }
  .progress > div{
    height:100%;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#1e40af);
    background-size:200% 100%;
    width:0;
    transition:width .3s ease;
    animation:shine 2s linear infinite;
  }
  @keyframes shine{to{background-position:-200% 0}}

  /* ═══════════ وضعیت ═══════════ */
  #status{
    margin-top:20px;
    font-size:17px;
    font-weight:800;
    min-height:28px;
    text-align:center;
    line-height:1.6;
  }
  .ok{color:var(--ok)}
  .err{color:var(--err)}

  /* ═══════════ موبایل ═══════════ */
  @media (max-width:480px){
    body{padding:20px 14px 40px; font-size:16px}
    .header .icon{width:68px; height:68px; font-size:34px; border-radius:20px}
    .header h1{font-size:24px}
    .header .subtitle{font-size:14px}
    .main-card{padding:24px 20px; border-radius:24px}
    .nav-grid{grid-template-columns:1fr; gap:10px}
    .nav-btn{font-size:16px; padding:16px 18px}
    .field-label{font-size:16px}
    .token-input, .field textarea, .field input[type="file"]{font-size:16px; padding:14px 18px}
    .group-chips label{font-size:16px; padding:12px 18px}
    .btn-main{font-size:18px; padding:18px 22px}
    .btn-ghost{font-size:15px; padding:16px 22px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- هدر -->
  <div class="header">
    <div class="icon">📤</div>
    <h1>سامانه پیام‌رسان سما</h1>
    <div class="subtitle">پنل ادمین — نسخه ۵/۱۱</div>
  </div>

  <!-- کارت اصلی -->
  <div class="main-card">

    <!-- دکمه‌های ناوبری -->
    <div class="nav-grid">
      <a href="./index.html" class="nav-btn primary">🌐 نمایش پیام‌ها</a>
      <a href="./stats.html" class="nav-btn ghost">📊 صفحه آمار</a>
    </div>

    <!-- کارت توکن ذخیره‌شده -->
    <div class="token-card" id="tokenSaved" hidden>
      <div class="info">
        <span class="icon">✅</span>
        <span>توکن ذخیره شده — آماده ارسال</span>
      </div>
      <button class="logout-btn" onclick="logout()">خروج از حساب</button>
    </div>

    <!-- فرم توکن -->
    <div class="token-form" id="tokenForm">
      <label class="field-label">🔑 توکن گیت‌هاب <span class="req">*</span></label>
      <input type="password" id="token" class="token-input"
             placeholder="github_pat_..." autocomplete="off">
      <div class="save-token-row">
        <button class="btn-main" style="flex:0; padding:16px 26px; font-size:17px; min-width:auto"
                onclick="saveToken()">💾 ذخیره توکن</button>
        <a href="https://github.com/settings/tokens?type=beta" target="_blank"
           style="color:#2563eb; font-size:15px; font-weight:700">
          از این صفحه بساز ↗
        </a>
      </div>
      <div id="tokenMsg" class="token-msg"></div>
    </div>

    <!-- گروه مقصد -->
    <div class="field" style="margin-bottom:20px">
      <label class="field-label">📁 گروه مقصد</label>
      <div class="group-chips" id="groupChips"></div>
    </div>

    <!-- متن پیام -->
    <div class="field">
      <label class="field-label">✍️ متن پیام <span style="font-size:14px; color:var(--muted); font-weight:600">(اختیاری اگر عکس داری)</span></label>
      <textarea id="msg" placeholder="سلام..."></textarea>
    </div>

    <!-- عکس -->
    <div class="field">
      <label class="field-label">🖼 عکس <span style="font-size:14px; color:var(--muted); font-weight:600">(اختیاری)</span></label>
      <input type="file" id="imgFile" accept="image/*">
      <img id="preview" class="preview">
    </div>

    <!-- دکمه‌ها -->
    <div class="actions">
      <button class="btn-main" onclick="send()">ارسال 🚀</button>
      <button class="btn-ghost" onclick="reload()">🔄</button>
    </div>

    <div class="progress" id="prog"><div id="progBar"></div></div>
    <div id="status"></div>

  </div>

</div>

<script src="config.js"></script>
<script>
const C = window.CONFIG;
const API = `https://api.github.com/repos/${C.owner}/${C.repo}/contents`;
const MSG_PATH = 'messages.json';
const TOKEN_KEY = 'gh_token';

const tokenEl = document.getElementById('token');

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

function saveToken() {
  const t = tokenEl.value.trim();
  const msgEl = document.getElementById('tokenMsg');
  if (!t) { msgEl.innerHTML = '<span style="color:#dc2626">❌ توکن رو وارد کن</span>'; return; }
  if (!t.startsWith('github_pat_') && !t.startsWith('ghp_')) {
    msgEl.innerHTML = '<span style="color:#dc2626">❌ فرمت توکن اشتباهه</span>'; return;
  }
  localStorage.setItem(TOKEN_KEY, t);
  msgEl.innerHTML = '<span style="color:#16a34a">✅ توکن ذخیره شد!</span>';
  updateTokenUI();
  reload();
}

function logout() {
  if (!confirm('توکن پاک بشه؟')) return;
  localStorage.removeItem(TOKEN_KEY);
  tokenEl.value = '';
  updateTokenUI();
  setStatus('');
}

function updateTokenUI() {
  const t = getToken();
  const saved = document.getElementById('tokenSaved');
  const form = document.getElementById('tokenForm');
  if (t) { saved.hidden = false; form.hidden = true; }
  else   { saved.hidden = true;  form.hidden = false; }
}

// گروه‌ها
const groupChips = document.getElementById('groupChips');
groupChips.innerHTML = Object.entries(C.groups)
  .map(([k,g], i) => `
    <input type="radio" name="group" id="g-${k}" value="${k}" ${i===0?'checked':''}>
    <label for="g-${k}">${g.emoji} ${g.name}</label>
  `).join('');

function getSelectedGroup() {
  const el = document.querySelector('input[name="group"]:checked');
  return el ? el.value : 'friends';
}

const setStatus = (t, cls='') => {
  document.getElementById('status').innerHTML = `<span class="${cls}">${t}</span>`;
};

const b64decode = b64 => {
  const bin = atob(b64.replace(/\n/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
};
const b64encodeStr = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};
const fileToBase64 = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload  = () => res(r.result.split(',')[1]);
  r.onerror = rej;
  r.readAsDataURL(file);
});

const imgFile = document.getElementById('imgFile');
const preview = document.getElementById('preview');
imgFile.onchange = () => {
  const f = imgFile.files[0];
  if (!f) { preview.style.display = 'none'; return; }
  preview.src = URL.createObjectURL(f);
  preview.style.display = 'block';
};

async function getFile(path) {
  const r = await fetch(`${API}/${path}?t=${Date.now()}`, {
    headers: { Authorization: `token ${getToken()}` }
  });
  if (r.status === 404) return { sha: null, data: null };
  if (r.status === 401) throw new Error('401 — توکن منقضی یا اشتباهه');
  if (!r.ok) throw new Error('خطا در خواندن (' + r.status + ')');
  const j = await r.json();
  return { sha: j.sha, data: JSON.parse(b64decode(j.content)) };
}

async function putFile(path, base64Content, sha, commitMsg) {
  const body = { message: commitMsg, content: base64Content };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${getToken()}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('آپدیت نشد (' + r.status + ')');
  return r.json();
}

async function uploadImage(file) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const filename = `${crypto.randomUUID()}.${ext}`;
  const path = `images/${filename}`;
  const b64 = await fileToBase64(file);
  await putFile(path, b64, null, 'upload image');
  return `https://raw.githubusercontent.com/${C.owner}/${C.repo}/${C.branch}/${path}`;
}

async function send() {
  if (!getToken()) return setStatus('اول توکن رو وارد کن', 'err');

  const text = document.getElementById('msg').value.trim();
  const file = imgFile.files[0];
  if (!text && !file) return setStatus('متن یا عکس لازمه', 'err');

  const prog = document.getElementById('prog');
  const bar  = document.getElementById('progBar');
  prog.style.display = 'block';
  bar.style.width = '10%';

  try {
    let imageUrl = null;
    if (file) {
      setStatus('در حال آپلود عکس...');
      bar.style.width = '40%';
      imageUrl = await uploadImage(file);
      bar.style.width = '70%';
    }

    setStatus('در حال ثبت پیام...');
    const { sha, data } = await getFile(MSG_PATH);
    const db = data || { messages: [], reactions: [], replies: [], seen: [] };
    db.messages ||= []; db.reactions ||= []; db.replies ||= []; db.seen ||= [];

    db.messages.push({
      id: crypto.randomUUID(),
      text,
      group: getSelectedGroup(),
      time: new Date().toISOString(),
      ...(imageUrl ? { image: imageUrl } : {})
    });

    await putFile(MSG_PATH, b64encodeStr(JSON.stringify(db, null, 2)), sha, 'new message');
    bar.style.width = '100%';

    document.getElementById('msg').value = '';
    imgFile.value = ''; preview.style.display = 'none';
    setStatus('✅ ارسال شد! اعلان تا چند لحظه دیگه میاد 📲', 'ok');
  } catch (e) {
    setStatus('❌ ' + e.message, 'err');
  } finally {
    setTimeout(() => { prog.style.display = 'none'; bar.style.width = '0'; }, 600);
  }
}

async function reload() {
  if (!getToken()) return;
  try {
    const { data: db } = await getFile(MSG_PATH);
    if (!db) return setStatus('messages.json پیدا نشد', 'err');
    setStatus(`📨 ${db.messages?.length||0} پیام، ${db.reactions?.length||0} ری‌اکشن، ${db.replies?.length||0} پاسخ`, 'ok');
  } catch (e) { setStatus('❌ ' + e.message, 'err'); }
}

tokenEl.value = getToken() || '';
updateTokenUI();
if (getToken()) reload();
</script>
</body>
</html>
