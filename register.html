<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="description" content="سامانه پیام‌رسان سما — ورود">
<title>سما — ورود</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --primary:#1e40af;
    --primary-2:#3b82f6;
    --primary-deep:#1e3a8a;
    --text:#0c1e3e;
    --muted:#64748b;
    --border:#bfdbfe;
    --ok:#16a34a;
    --err:#dc2626;
    --card:#fff;
    --card-soft:#f0f7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Vazirmatn,system-ui,sans-serif;
    font-size:17px;
    background:
      radial-gradient(1200px 600px at 100% -10%, #93c5fd 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #bfdbfe 0%, transparent 55%),
      linear-gradient(160deg,#dbeafe 0%, #eff6ff 45%, #fff 100%);
    background-attachment:fixed;
    color:var(--text);
    padding:32px 20px 60px;
    line-height:1.75;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .wrap{max-width:520px; width:100%}

  .header{text-align:center; margin-bottom:28px}
  .header .icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:100px; height:100px; border-radius:28px;
    background:linear-gradient(135deg,#1e40af,#3b82f6,#60a5fa);
    background-size:200% 200%;
    color:#fff; font-size:48px; font-weight:900;
    box-shadow:0 20px 50px rgba(30,64,175,.45);
    margin-bottom:16px;
    animation:shine 6s ease infinite;
    font-family:Vazirmatn,sans-serif;
  }
  @keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .header h1{
    font-size:30px; margin:0 0 6px; font-weight:900;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:-.5px;
  }
  .header .subtitle{color:var(--muted); font-size:16px; font-weight:600}

  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:26px; padding:32px 28px;
    box-shadow:0 16px 50px rgba(30,64,175,.18), 0 4px 14px rgba(12,30,62,.06);
    position:relative; overflow:hidden;
    animation:in .5s cubic-bezier(.21,1.02,.73,1);
  }
  .card::before{
    content:''; position:absolute; top:0; right:0; left:0; height:6px;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#60a5fa);
  }
  @keyframes in{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none}}

  .welcome{
    text-align:center; padding:4px 0 24px;
    border-bottom:2px dashed var(--border); margin-bottom:24px;
  }
  .welcome h2{font-size:22px; margin:0 0 8px; font-weight:900; color:var(--primary-deep)}
  .welcome p{color:var(--muted); font-size:15px; margin:0; line-height:1.7; font-weight:600}

  .phone-field{
    text-align:center;
    margin-bottom:20px;
  }
  .phone-field label{
    display:block;
    font-size:18px; font-weight:800; color:var(--text);
    margin-bottom:12px;
  }
  .phone-field label .req{color:var(--err); font-weight:900}

  .phone-input{
    width:100%;
    padding:20px 22px;
    background:var(--card-soft);
    border:2.5px solid var(--border);
    color:var(--text);
    border-radius:18px;
    font-family:'Courier New',monospace;
    font-size:24px;
    font-weight:800;
    letter-spacing:6px;
    text-align:center;
    transition:all .25s ease;
  }
  .phone-input::placeholder{
    color:var(--muted); opacity:.4; font-size:20px; letter-spacing:4px;
  }
  .phone-input:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 6px rgba(30,64,175,.15);
  }
  .phone-input.valid{border-color:#6ee7b7; background:#f0fdf4}
  .phone-input.invalid{border-color:#fca5a5; background:#fef2f2}

  .hint{
    font-size:14px; color:var(--muted);
    margin-top:10px; font-weight:600; min-height:20px;
    text-align:center;
  }
  .hint.ok{color:var(--ok); font-weight:700}
  .hint.err{color:var(--err); font-weight:700}

  button[type="submit"]{
    width:100%;
    padding:22px 28px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff; border:none; border-radius:18px;
    cursor:pointer; font-family:inherit;
    font-size:22px; font-weight:900;
    box-shadow:0 12px 32px rgba(30,64,175,.4);
    transition:all .25s ease;
    margin-top:16px;
    letter-spacing:-.3px;
  }
  button[type="submit"]:hover:not(:disabled){
    transform:translateY(-3px);
    box-shadow:0 18px 42px rgba(30,64,175,.55);
  }
  button[type="submit"]:active:not(:disabled){transform:translateY(0) scale(.98)}
  button[type="submit"]:disabled{
    opacity:.5; cursor:not-allowed; box-shadow:none;
    background:linear-gradient(135deg,#94a3b8,#cbd5e1);
  }

  .status{
    margin-top:20px; padding:18px 22px;
    border-radius:16px; font-size:16px; font-weight:700;
    text-align:center; display:none; line-height:1.7;
  }
  .status.show{display:block}
  .status.ok{background:#ecfdf5; color:#047857; border:2px solid #a7f3d0}
  .status.err{background:#fef2f2; color:#b91c1c; border:2px solid #fecaca}
  .status.loading{background:#eff6ff; color:#1e40af; border:2px solid #bfdbfe}
  .status.info{background:#fef3c7; color:#92400e; border:2px solid #fcd34d}

  .spinner{
    display:inline-block; width:20px; height:20px;
    border:3px solid rgba(30,64,175,.25);
    border-top-color:var(--primary);
    border-radius:50%; animation:spin .8s linear infinite;
    vertical-align:middle; margin-left:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .privacy{
    text-align:center; font-size:14px; color:var(--muted);
    margin-top:24px; line-height:1.9; font-weight:600;
  }
  .privacy b{color:var(--primary); font-weight:800}

  .link-row{
    text-align:center;
    margin-top:20px;
    padding-top:20px;
    border-top:1px dashed var(--border);
    font-size:14px;
  }
  .link-row a{
    color:var(--primary);
    text-decoration:none;
    font-weight:800;
  }
  .link-row a:hover{text-decoration:underline}

  @media (max-width:480px){
    body{padding:20px 14px 40px}
    .header .icon{width:80px; height:80px; font-size:38px; border-radius:22px}
    .header h1{font-size:24px}
    .card{padding:24px 20px; border-radius:22px}
    .welcome h2{font-size:19px}
    .phone-input{font-size:20px; padding:16px 18px; letter-spacing:4px}
    button[type="submit"]{font-size:18px; padding:18px 22px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="icon">سما</div>
    <h1>سامانه پیام‌رسان سما</h1>
    <div class="subtitle">ورود — نسخه ۵/۱۱</div>
  </div>

  <div class="card">

    <div class="welcome">
      <h2>👋 خوش آمدی!</h2>
      <p>برای ورود، شماره موبایلی که مدیر سامانه ثبت کرده را وارد کن</p>
    </div>

    <form id="loginForm" novalidate>

      <div class="phone-field">
        <label>📱 شماره موبایل <span class="req">*</span></label>
        <input type="tel" id="phone"
               class="phone-input"
               placeholder="09123456789"
               inputmode="numeric"
               maxlength="11"
               autocomplete="tel-national"
               autofocus>
        <div class="hint" id="hintPhone">۱۱ رقم، با ۰۹ شروع بشه</div>
      </div>

      <button type="submit" id="submitBtn" disabled>ورود به سامانه 🚀</button>

      <div class="status" id="status"></div>

    </form>

    <div class="link-row">
      🔐 فقط شماره‌های مجاز توسط مدیر سامانه می‌توانند وارد شوند
    </div>

  </div>

  <div class="privacy">
    🔒 شماره شما فقط برای <b>شناسایی در سما</b> استفاده می‌شود.
  </div>

</div>

<script src="config.js"></script>
<script>
const C = window.CONFIG;
const ALLOWED_URL = `https://raw.githubusercontent.com/${C.owner}/${C.repo}/${C.branch}/allowed.json`;

const form = document.getElementById('loginForm');
const phone = document.getElementById('phone');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const hintPhone = document.getElementById('hintPhone');

let allowedList = null;

// ═══════════════════════════════════════════════════════
// 📥 دریافت لیست مجاز
// ═══════════════════════════════════════════════════════
async function loadAllowed() {
  try {
    const res = await fetch(ALLOWED_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allowedList = data.allowed || [];
    return true;
  } catch(e) {
    console.error('loadAllowed error:', e);
    return false;
  }
}

// ═══════════════════════════════════════════════════════
// ✅ اعتبارسنجی شماره
// ═══════════════════════════════════════════════════════
function validatePhone() {
  const v = phone.value.replace(/\D/g, '');
  phone.value = v;

  if (!v) {
    phone.classList.remove('valid', 'invalid');
    hintPhone.textContent = '۱۱ رقم، با ۰۹ شروع بشه';
    hintPhone.className = 'hint';
    return false;
  }
  if (v.length < 11) {
    phone.classList.remove('valid', 'invalid');
    hintPhone.textContent = `${v.length} از ۱۱ رقم وارد شده`;
    hintPhone.className = 'hint';
    return false;
  }
  if (!/^09\d{9}$/.test(v)) {
    phone.classList.add('invalid');
    phone.classList.remove('valid');
    hintPhone.textContent = 'شماره باید با ۰۹ شروع شده و ۱۱ رقم باشد';
    hintPhone.className = 'hint err';
    return false;
  }
  phone.classList.add('valid');
  phone.classList.remove('invalid');
  hintPhone.textContent = '✓ شماره معتبر است';
  hintPhone.className = 'hint ok';
  return true;
}

function updateSubmitBtn() {
  submitBtn.disabled = !/^09\d{9}$/.test(phone.value);
}

phone.oninput = () => { validatePhone(); updateSubmitBtn(); };

function showStatus(type, msg) {
  statusEl.className = 'status show ' + type;
  statusEl.innerHTML = msg;
}

// ═══════════════════════════════════════════════════════
// 🚀 ورود
// ═══════════════════════════════════════════════════════
form.onsubmit = async (e) => {
  e.preventDefault();

  const phoneNum = phone.value.trim();

  submitBtn.disabled = true;
  showStatus('loading', 'در حال بررسی شماره... <span class="spinner"></span>');

  // اگه لیست بارگیری نشده، دوباره تلاش کن
  if (!allowedList) {
    const ok = await loadAllowed();
    if (!ok) {
      submitBtn.disabled = false;
      showStatus('err', '❌ خطا در ارتباط با سرور. اینترنت خود را بررسی کنید.');
      return;
    }
  }

  // جستجو در لیست
  const user = allowedList.find(u => u.phone === phoneNum);

  if (!user) {
    submitBtn.disabled = false;
    showStatus('err',
      '❌ شماره شما در لیست مجاز نیست.<br>' +
      '<small style="font-weight:600">با مدیر سامانه تماس بگیرید تا شما را اضافه کند</small>');
    return;
  }

  // ✅ کاربر مجاز
  try {
    localStorage.setItem('myName', user.name);
    localStorage.setItem('myGroup', user.group);
    localStorage.setItem('myPhone', user.phone);
    localStorage.setItem('myProvince', user.province || '');
    localStorage.setItem('registered', 'true');

    showStatus('ok',
      `✅ خوش آمدی ${user.name}!<br>در حال انتقال به سما...`);

    setTimeout(() => {
      location.href = './index.html';
    }, 1200);
  } catch(e) {
    submitBtn.disabled = false;
    showStatus('err', '❌ خطا: ' + e.message);
  }
};

// ═══════════════════════════════════════════════════════
// 🚀 شروع
// ═══════════════════════════════════════════════════════
(async () => {
  // اگه قبلاً وارد شده، مستقیم بره PWA
  if (localStorage.getItem('registered') === 'true' && localStorage.getItem('myName')) {
    location.href = './index.html';
    return;
  }

  // بارگیری لیست مجاز
  showStatus('loading', 'در حال بارگذاری... <span class="spinner"></span>');
  const ok = await loadAllowed();
  if (ok) {
    statusEl.classList.remove('show');
  } else {
    showStatus('err', '❌ خطا در بارگذاری لیست مجاز. اینترنت خود را بررسی کنید.');
  }
})();
</script>
</body>
</html>
