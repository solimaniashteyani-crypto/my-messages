<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="description" content="سامانه پیام‌رسان سما — نسخه 5/11">
<title>سامانه پیام‌رسان سما — نسخه ۵/۱۱</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --primary:#1e40af;
    --primary-2:#3b82f6;
    --primary-deep:#1e3a8a;
    --accent:#2563eb;
    --bg-soft:#eff6ff;
    --text:#0c1e3e;
    --text-soft:#1e40af;
    --muted:#64748b;
    --border:#bfdbfe;
    --border-strong:#93c5fd;
    --ok:#16a34a;
    --err:#dc2626;
    --card:#ffffff;
    --card-soft:#f0f7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Vazirmatn,system-ui,sans-serif;
    font-size:18px;
    background:
      radial-gradient(1200px 600px at 100% -10%, #93c5fd 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #bfdbfe 0%, transparent 55%),
      linear-gradient(160deg,#dbeafe 0%, #eff6ff 45%, #fff 100%);
    background-attachment:fixed;
    color:var(--text);
    padding:32px 20px 60px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.8;
  }

  .wrap{max-width:600px; margin:0 auto; padding-top:20px}

  /* ───── لوگو ───── */
  .logo{text-align:center; margin-bottom:32px}
  .logo .icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:110px; height:110px; border-radius:32px;
    background:linear-gradient(135deg,#1e40af,#3b82f6,#60a5fa);
    background-size:200% 200%;
    color:#fff;
    font-size:60px;
    font-weight:900;
    box-shadow:0 20px 50px rgba(30,64,175,.45);
    margin-bottom:20px;
    animation:shine 6s ease infinite;
    font-family:sans-serif;
    text-shadow:0 3px 10px rgba(0,0,0,.2);
  }
  @keyframes shine{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  .logo h1{
    font-size:34px;
    margin:0;
    font-weight:900;
    background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-.5px;
  }
  .logo .subtitle{
    color:var(--text-soft);
    font-size:18px;
    margin-top:10px;
    font-weight:600;
  }
  .logo .version{
    display:inline-block;
    margin-top:14px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff;
    padding:8px 20px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    box-shadow:0 6px 18px rgba(30,64,175,.35);
  }

  /* ───── کارت ───── */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;
    padding:36px 32px;
    box-shadow:
      0 10px 30px rgba(12,30,62,.08),
      0 25px 60px rgba(30,64,175,.15);
    animation:in .5s cubic-bezier(.21,1.02,.73,1);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; right:0; left:0; height:6px;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#60a5fa);
  }
  @keyframes in{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
  }

  .welcome{
    text-align:center; padding:6px 0 28px;
    border-bottom:2px dashed var(--border); margin-bottom:28px;
  }
  .welcome h2{
    font-size:26px;
    margin:0 0 10px;
    font-weight:900;
    color:var(--primary-deep);
  }
  .welcome p{
    color:var(--muted);
    font-size:17px;
    margin:0;
    line-height:1.7;
    font-weight:500;
  }

  /* ───── فرم ───── */
  .field{margin-bottom:26px}
  .field label{
    display:flex; align-items:center; gap:10px;
    font-size:19px;
    font-weight:800;
    color:var(--text);
    margin-bottom:14px;
  }
  .field label .icon-label{
    font-size:22px;
  }
  .field label .req{
    color:var(--err);
    font-weight:900;
    font-size:22px;
    margin-right:auto;
  }
  .field input{
    width:100%;
    padding:20px 24px;
    background:var(--card-soft);
    border:2.5px solid var(--border);
    color:var(--text);
    border-radius:18px;
    font-family:inherit;
    font-size:20px;
    font-weight:600;
    transition:all .25s ease;
  }
  .field input::placeholder{
    color:var(--muted);
    opacity:.6;
    font-weight:400;
    font-size:18px;
  }
  .field input:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 6px rgba(30,64,175,.15);
    transform:translateY(-2px);
  }
  .field input.valid{
    border-color:#6ee7b7;
    background:#f0fdf4;
  }
  .field input.invalid{
    border-color:#fca5a5;
    background:#fef2f2;
  }
  .field .hint{
    font-size:15px;
    color:var(--muted);
    margin-top:10px;
    display:flex; align-items:center; gap:6px;
    min-height:22px;
    font-weight:600;
    transition:all .2s ease;
  }
  .field .hint.err{color:var(--err); font-weight:700}
  .field .hint.ok{color:var(--ok); font-weight:700}

  .phone-input input{
    font-family:'Courier New',monospace;
    letter-spacing:5px;
    text-align:center;
    font-weight:800;
    font-size:22px;
  }

  /* ───── دکمه ───── */
  button[type="submit"]{
    width:100%;
    padding:22px 32px;
    background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);
    color:#fff;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-family:inherit;
    font-size:22px;
    font-weight:900;
    box-shadow:0 12px 32px rgba(30,64,175,.4);
    transition:all .25s ease;
    margin-top:18px;
    letter-spacing:-.3px;
  }
  button[type="submit"]:hover:not(:disabled){
    transform:translateY(-3px);
    box-shadow:0 18px 42px rgba(30,64,175,.55);
  }
  button[type="submit"]:active:not(:disabled){
    transform:translateY(0) scale(.98);
  }
  button[type="submit"]:disabled{
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
    background:linear-gradient(135deg,#94a3b8,#cbd5e1);
  }

  /* ───── وضعیت ───── */
  .status{
    margin-top:22px;
    padding:18px 22px;
    border-radius:16px;
    font-size:17px;
    font-weight:700;
    text-align:center;
    display:none;
    line-height:1.7;
  }
  .status.show{display:block; animation:in .3s ease}
  .status.ok{background:#ecfdf5; color:#047857; border:2px solid #a7f3d0}
  .status.err{background:#fef2f2; color:#b91c1c; border:2px solid #fecaca}
  .status.loading{background:#eff6ff; color:#1e40af; border:2px solid #bfdbfe}

  .spinner{
    display:inline-block;
    width:22px; height:22px;
    border:3px solid rgba(30,64,175,.25);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-left:10px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .privacy{
    text-align:center;
    font-size:15px;
    color:var(--muted);
    margin-top:28px;
    line-height:2;
    font-weight:600;
  }
  .privacy b{color:var(--primary); font-weight:800}

  @media (max-width:480px){
    body{font-size:16px; padding:20px 16px 40px}
    .logo .icon{width:90px; height:90px; font-size:50px; border-radius:26px}
    .logo h1{font-size:26px}
    .logo .subtitle{font-size:16px}
    .card{padding:26px 22px; border-radius:22px}
    .welcome h2{font-size:22px}
    .welcome p{font-size:15px}
    .field label{font-size:17px}
    .field input{padding:16px 18px; font-size:17px; border-radius:16px}
    .field input::placeholder{font-size:15px}
    .phone-input input{font-size:19px; letter-spacing:3px}
    button[type="submit"]{padding:18px 24px; font-size:19px; border-radius:16px}
    .privacy{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="icon">۱۱</div>
    <h1>سامانه پیام‌رسان سما</h1>
    <div class="subtitle">پیام‌رسان شخصی، بدون واسطه</div>
    <div class="version">نسخه ۵/۱۱</div>
  </div>

  <div class="card">

    <div class="welcome">
      <h2>👋 خوش آمدی!</h2>
      <p>برای استفاده از سامانه، لطفاً اطلاعاتت رو تکمیل کن</p>
    </div>

    <form id="registerForm" novalidate>

      <div class="field">
        <label><span class="icon-label">👤</span> نام <span class="req">*</span></label>
        <input type="text" id="firstName" placeholder="مثلاً: جواد"
               autocomplete="given-name" required>
        <div class="hint" id="hintFirst"></div>
      </div>

      <div class="field">
        <label><span class="icon-label">👥</span> نام خانوادگی <span class="req">*</span></label>
        <input type="text" id="lastName" placeholder="مثلاً: رضایی"
               autocomplete="family-name" required>
        <div class="hint" id="hintLast"></div>
      </div>

      <div class="field">
        <label><span class="icon-label">📍</span> استان <span class="req">*</span></label>
        <input type="text" id="province" placeholder="مثلاً: تهران"
               autocomplete="address-level1" required>
        <div class="hint" id="hintProvince"></div>
      </div>

      <div class="field">
        <label><span class="icon-label">📱</span> شماره موبایل <span class="req">*</span></label>
        <div class="phone-input">
          <input type="tel" id="phone" placeholder="09123456789"
                 inputmode="numeric" maxlength="11"
                 autocomplete="tel-national" required>
        </div>
        <div class="hint" id="hintPhone">۱۱ رقم، با ۰۹ شروع بشه</div>
      </div>

      <button type="submit" id="submitBtn" disabled>ثبت‌نام و ورود 🚀</button>

      <div class="status" id="status"></div>

    </form>

  </div>

  <div class="privacy">
    🔒 اطلاعات شما فقط برای <b>شناسایی در سامانه</b> استفاده می‌شود.<br>
    هیچ‌کسی به‌جز مدیر سامانه به اطلاعات شما دسترسی ندارد.
  </div>

</div>

<script src="config.js"></script>
<script>
const C = window.CONFIG;
const REGISTER_TOPIC = C.interactionsTopic + '-reg';

const form       = document.getElementById('registerForm');
const firstName  = document.getElementById('firstName');
const lastName   = document.getElementById('lastName');
const province   = document.getElementById('province');
const phone      = document.getElementById('phone');
const submitBtn  = document.getElementById('submitBtn');
const statusEl   = document.getElementById('status');

function validateText(el, hintEl, label, minLen = 2) {
  const v = el.value.trim();
  if (!v) {
    el.classList.remove('valid', 'invalid');
    hintEl.textContent = '';
    hintEl.className = 'hint';
    return false;
  }
  if (v.length < minLen) {
    el.classList.add('invalid');
    el.classList.remove('valid');
    hintEl.textContent = `حداقل ${minLen} حرف وارد کن`;
    hintEl.className = 'hint err';
    return false;
  }
  el.classList.add('valid');
  el.classList.remove('invalid');
  hintEl.textContent = `✓ ${label} درست است`;
  hintEl.className = 'hint ok';
  return true;
}

function validatePhone() {
  const v = phone.value.replace(/\D/g, '');
  phone.value = v;
  const hintEl = document.getElementById('hintPhone');

  if (!v) {
    phone.classList.remove('valid', 'invalid');
    hintEl.textContent = '۱۱ رقم، با ۰۹ شروع بشه';
    hintEl.className = 'hint';
    return false;
  }

  if (!/^09\d{9}$/.test(v)) {
    phone.classList.add('invalid');
    phone.classList.remove('valid');
    hintEl.textContent = 'شماره باید با ۰۹ شروع شده و ۱۱ رقم باشد';
    hintEl.className = 'hint err';
    return false;
  }

  phone.classList.add('valid');
  phone.classList.remove('invalid');
  hintEl.textContent = '✓ شماره معتبر است';
  hintEl.className = 'hint ok';
  return true;
}

function updateSubmitBtn() {
  const ok =
    firstName.value.trim().length >= 2 &&
    lastName.value.trim().length >= 2 &&
    province.value.trim().length >= 2 &&
    /^09\d{9}$/.test(phone.value);
  submitBtn.disabled = !ok;
}

firstName.oninput = () => { validateText(firstName, document.getElementById('hintFirst'), 'نام'); updateSubmitBtn(); };
lastName.oninput  = () => { validateText(lastName,  document.getElementById('hintLast'),  'نام خانوادگی'); updateSubmitBtn(); };
province.oninput  = () => { validateText(province,  document.getElementById('hintProvince'), 'استان'); updateSubmitBtn(); };
phone.oninput     = () => { validatePhone(); updateSubmitBtn(); };

function showStatus(type, msg) {
  statusEl.className = 'status show ' + type;
  statusEl.innerHTML = msg;
}

form.onsubmit = async (e) => {
  e.preventDefault();

  const data = {
    type: 'register',
    firstName: firstName.value.trim(),
    lastName:  lastName.value.trim(),
    province:  province.value.trim(),
    phone:     phone.value,
    fullName:  firstName.value.trim() + ' ' + lastName.value.trim(),
    time:      new Date().toISOString()
  };

  submitBtn.disabled = true;
  showStatus('loading', 'در حال ثبت اطلاعات... <span class="spinner"></span>');

  try {
    const res = await fetch(`${C.ntfyBase}/${REGISTER_TOPIC}`, {
      method: 'POST',
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('خطا در ارسال: ' + res.status);

    localStorage.setItem('myName',     data.fullName);
    localStorage.setItem('myFullInfo', JSON.stringify(data));
    localStorage.setItem('myGroup',    'friends');
    localStorage.setItem('registered', 'true');

    showStatus('ok', '✅ ثبت‌نام موفق!<br>در حال انتقال به سامانه...');

    setTimeout(() => {
      location.href = './index.html';
    }, 1500);

  } catch (err) {
    submitBtn.disabled = false;
    showStatus('err', '❌ خطا: ' + err.message);
  }
};

if (localStorage.getItem('registered') === 'true' && localStorage.getItem('myName')) {
  location.href = './index.html';
}
</script>
</body>
</html>
