<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="description" content="سامانه پیام‌رسان سما — نسخه 5/11">
<title>سامانه پیام‌رسان سما — نسخه ۵/۱۱</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --accent:#10b981; --accent-2:#14b8a6; --accent-deep:#047857;
    --bg-soft:#ecfdf5;
    --text:#064e3b; --text-soft:#0f766e; --muted:#6b9080;
    --border:#a7f3d0; --border-strong:#6ee7b7;
    --ok:#16a34a; --err:#dc2626; --warn:#d97706;
    --card:#fff; --card-soft:#f0fdf4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Vazirmatn,system-ui,sans-serif;
    font-size:16px;
    background:
      radial-gradient(1200px 600px at 100% -10%, #a7f3d0 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #99f6e4 0%, transparent 55%),
      linear-gradient(160deg,#d1fae5 0%, #ecfdf5 45%, #fff 100%);
    background-attachment:fixed;
    color:var(--text);
    padding:24px 20px 60px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.7;
  }

  .wrap{max-width:540px; margin:0 auto; padding-top:20px}

  /* ───── لوگو ───── */
  .logo{text-align:center; margin-bottom:28px}
  .logo .icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:92px; height:92px; border-radius:26px;
    background:linear-gradient(135deg,#10b981,#14b8a6,#0ea5e9);
    background-size:200% 200%;
    color:#fff; font-size:50px; font-weight:800;
    box-shadow:0 16px 40px rgba(16,185,129,.35);
    margin-bottom:16px;
    animation:shine 6s ease infinite;
    font-family:sans-serif;
  }
  @keyframes shine{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  .logo h1{
    font-size:26px; margin:0; font-weight:800;
    background:linear-gradient(135deg,#047857,#10b981,#14b8a6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:-.3px;
  }
  .logo .subtitle{
    color:var(--text-soft); font-size:15px; margin-top:8px;
    font-weight:500;
  }
  .logo .version{
    display:inline-block; margin-top:10px;
    background:rgba(16,185,129,.12);
    color:var(--accent-deep);
    padding:5px 14px; border-radius:999px;
    font-size:13px; font-weight:600;
    border:1px solid rgba(16,185,129,.25);
  }

  /* ───── کارت ───── */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:28px 26px;
    box-shadow:
      0 8px 24px rgba(6,78,59,.06),
      0 20px 50px rgba(16,185,129,.12);
    animation:in .45s cubic-bezier(.21,1.02,.73,1);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; right:0; left:0; height:4px;
    background:linear-gradient(90deg,#10b981,#14b8a6,#0ea5e9);
  }
  @keyframes in{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
  }

  .welcome{
    text-align:center; padding:4px 0 22px;
    border-bottom:1.5px dashed var(--border); margin-bottom:22px;
  }
  .welcome h2{
    font-size:19px; margin:0 0 8px; font-weight:700;
    color:var(--accent-deep);
  }
  .welcome p{
    color:var(--muted); font-size:14px; margin:0;
    line-height:1.6;
  }

  /* ───── فرم ───── */
  .field{margin-bottom:20px}
  .field label{
    display:flex; align-items:center; gap:8px;
    font-size:15px; font-weight:700; color:var(--text);
    margin-bottom:10px;
  }
  .field label .icon-label{
    font-size:17px;
  }
  .field label .req{
    color:var(--err); font-weight:700; font-size:17px;
    margin-right:auto;
  }
  .field input{
    width:100%; padding:15px 18px;
    background:var(--card-soft);
    border:2px solid var(--border);
    color:var(--text);
    border-radius:14px;
    font-family:inherit; font-size:16px; font-weight:500;
    transition:all .25s ease;
  }
  .field input::placeholder{
    color:var(--muted); opacity:.7; font-weight:400;
  }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 5px rgba(16,185,129,.15);
    transform:translateY(-1px);
  }
  .field input.valid{
    border-color:#6ee7b7;
    background:#f0fdf4;
  }
  .field input.invalid{
    border-color:#fca5a5;
    background:#fef2f2;
  }
  .field .hint{
    font-size:13px; color:var(--muted); margin-top:8px;
    display:flex; align-items:center; gap:6px;
    min-height:18px; font-weight:500;
    transition:all .2s ease;
  }
  .field .hint.err{color:var(--err); font-weight:600}
  .field .hint.ok{color:var(--ok); font-weight:600}

  .phone-input input{
    font-family:'Courier New',monospace;
    letter-spacing:3px;
    text-align:center;
    font-weight:700;
    font-size:18px;
  }

  /* ───── دکمه ───── */
  button[type="submit"]{
    width:100%;
    padding:17px 28px;
    background:linear-gradient(135deg,#10b981,#14b8a6);
    color:#fff; border:none;
    border-radius:16px; cursor:pointer;
    font-family:inherit; font-size:17px; font-weight:700;
    box-shadow:0 8px 24px rgba(16,185,129,.35);
    transition:all .25s ease;
    margin-top:12px;
    letter-spacing:-.2px;
  }
  button[type="submit"]:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(16,185,129,.5);
    background:linear-gradient(135deg,#059669,#0d9488);
  }
  button[type="submit"]:active:not(:disabled){
    transform:translateY(0) scale(.98);
  }
  button[type="submit"]:disabled{
    opacity:.5; cursor:not-allowed; box-shadow:none;
    background:linear-gradient(135deg,#94a3b8,#cbd5e1);
  }

  /* ───── وضعیت ───── */
  .status{
    margin-top:18px; padding:14px 18px;
    border-radius:14px; font-size:15px; font-weight:600;
    text-align:center; display:none;
    line-height:1.6;
  }
  .status.show{display:block; animation:in .3s ease}
  .status.ok{background:#ecfdf5; color:#047857; border:1.5px solid #a7f3d0}
  .status.err{background:#fef2f2; color:#b91c1c; border:1.5px solid #fecaca}
  .status.loading{background:#f0fdf4; color:#0f766e; border:1.5px solid #a7f3d0}

  .spinner{
    display:inline-block; width:18px; height:18px;
    border:2.5px solid rgba(16,185,129,.25);
    border-top-color:#10b981;
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .privacy{
    text-align:center; font-size:13px; color:var(--muted);
    margin-top:24px; line-height:1.9; font-weight:500;
  }
  .privacy b{color:var(--accent-deep); font-weight:700}

  @media (max-width:400px){
    body{font-size:15px}
    .logo h1{font-size:22px}
    .logo .icon{width:78px; height:78px; font-size:42px}
    .card{padding:24px 20px; border-radius:20px}
    .welcome h2{font-size:17px}
    .field input{padding:13px 16px; font-size:15px}
    button[type="submit"]{padding:15px 24px; font-size:16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="icon">۱۱</div>
    <h1>سامانه پیام‌رسان سما</h1>
    <div class="subtitle">پیام‌رسان شخصی، بدون واسطه</div>
    <div class="version">نسخه ۵/۱۱</div>
  </div>

  <div class="card">

    <div class="welcome">
      <h2>👋 خوش آمدی!</h2>
      <p>برای استفاده از سامانه، لطفاً اطلاعاتت رو تکمیل کن</p>
    </div>

    <form id="registerForm" novalidate>

      <div class="field">
        <label><span class="icon-label">👤</span> نام <span class="req">*</span></label>
        <input type="text" id="firstName" placeholder="مثلاً: جواد"
               autocomplete="given-name" required>
        <div class="hint" id="hintFirst"></div>
      </div>

      <div class="field">
        <label><span class="icon-label">👥</span> نام خانوادگی <span class="req">*</span></label>
        <input type="text" id="lastName" placeholder="مثلاً: رضایی"
               autocomplete="family-name" required>
        <div class="hint" id="hintLast"></div>
      </div>

      <div class="field">
        <label><span class="icon-label">📍</span> استان <span class="req">*</span></label>
        <input type="text" id="province" placeholder="مثلاً: تهران"
               autocomplete="address-level1" required>
        <div class="hint" id="hintProvince"></div>
      </div>

      <div class="field">
        <label><span class="icon-label">📱</span> شماره موبایل <span class="req">*</span></label>
        <div class="phone-input">
          <input type="tel" id="phone" placeholder="09123456789"
                 inputmode="numeric" maxlength="11"
                 autocomplete="tel-national" required>
        </div>
        <div class="hint" id="hintPhone">۱۱ رقم، با ۰۹ شروع بشه</div>
      </div>

      <button type="submit" id="submitBtn" disabled>ثبت‌نام و ورود 🚀</button>

      <div class="status" id="status"></div>

    </form>

  </div>

  <div class="privacy">
    🔒 اطلاعات شما فقط برای <b>شناسایی در سامانه</b> استفاده می‌شود.<br>
    هیچ‌کسی به‌جز مدیر سامانه به اطلاعات شما دسترسی ندارد.
  </div>

</div>

<script src="config.js"></script>
<script>
const C = window.CONFIG;
const REGISTER_TOPIC = C.interactionsTopic + '-reg';

const form       = document.getElementById('registerForm');
const firstName  = document.getElementById('firstName');
const lastName   = document.getElementById('lastName');
const province   = document.getElementById('province');
const phone      = document.getElementById('phone');
const submitBtn  = document.getElementById('submitBtn');
const statusEl   = document.getElementById('status');

function validateText(el, hintEl, label, minLen = 2) {
  const v = el.value.trim();
  if (!v) {
    el.classList.remove('valid', 'invalid');
    hintEl.textContent = '';
    hintEl.className = 'hint';
    return false;
  }
  if (v.length < minLen) {
    el.classList.add('invalid');
    el.classList.remove('valid');
    hintEl.textContent = `حداقل ${minLen} حرف وارد کن`;
    hintEl.className = 'hint err';
    return false;
  }
  el.classList.add('valid');
  el.classList.remove('invalid');
  hintEl.textContent = `✓ ${label} درست است`;
  hintEl.className = 'hint ok';
  return true;
}

function validatePhone() {
  const v = phone.value.replace(/\D/g, '');
  phone.value = v;
  const hintEl = document.getElementById('hintPhone');

  if (!v) {
    phone.classList.remove('valid', 'invalid');
    hintEl.textContent = '۱۱ رقم، با ۰۹ شروع بشه';
    hintEl.className = 'hint';
    return false;
  }

  if (!/^09\d{9}$/.test(v)) {
    phone.classList.add('invalid');
    phone.classList.remove('valid');
    hintEl.textContent = 'شماره باید با ۰۹ شروع شده و ۱۱ رقم باشد';
    hintEl.className = 'hint err';
    return false;
  }

  phone.classList.add('valid');
  phone.classList.remove('invalid');
  hintEl.textContent = '✓ شماره معتبر است';
  hintEl.className = 'hint ok';
  return true;
}

function updateSubmitBtn() {
  const ok =
    firstName.value.trim().length >= 2 &&
    lastName.value.trim().length >= 2 &&
    province.value.trim().length >= 2 &&
    /^09\d{9}$/.test(phone.value);
  submitBtn.disabled = !ok;
}

firstName.oninput = () => { validateText(firstName, document.getElementById('hintFirst'), 'نام'); updateSubmitBtn(); };
lastName.oninput  = () => { validateText(lastName,  document.getElementById('hintLast'),  'نام خانوادگی'); updateSubmitBtn(); };
province.oninput  = () => { validateText(province,  document.getElementById('hintProvince'), 'استان'); updateSubmitBtn(); };
phone.oninput     = () => { validatePhone(); updateSubmitBtn(); };

function showStatus(type, msg) {
  statusEl.className = 'status show ' + type;
  statusEl.innerHTML = msg;
}

form.onsubmit = async (e) => {
  e.preventDefault();

  const data = {
    type: 'register',
    firstName: firstName.value.trim(),
    lastName:  lastName.value.trim(),
    province:  province.value.trim(),
    phone:     phone.value,
    fullName:  firstName.value.trim() + ' ' + lastName.value.trim(),
    time:      new Date().toISOString()
  };

  submitBtn.disabled = true;
  showStatus('loading', '<span class="spinner"></span> در حال ثبت اطلاعات...');

  try {
    const res = await fetch(`${C.ntfyBase}/${REGISTER_TOPIC}`, {
      method: 'POST',
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('خطا در ارسال: ' + res.status);

    localStorage.setItem('myName',     data.fullName);
    localStorage.setItem('myFullInfo', JSON.stringify(data));
    localStorage.setItem('myGroup',    'friends');
    localStorage.setItem('registered', 'true');

    showStatus('ok', '✅ ثبت‌نام موفق!<br>در حال انتقال به سامانه...');

    setTimeout(() => {
      location.href = './index.html';
    }, 1500);

  } catch (err) {
    submitBtn.disabled = false;
    showStatus('err', '❌ خطا: ' + err.message);
  }
};

if (localStorage.getItem('registered') === 'true' && localStorage.getItem('myName')) {
  location.href = './index.html';
}
</script>
</body>
</html>
